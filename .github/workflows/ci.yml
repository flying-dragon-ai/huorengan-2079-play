name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint + unit + build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (含 LFS 资产)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: 孤儿守卫（不可达 JS / 零引用资产）
        run: node tools/ci/check-orphans.mjs

      - name: Build 单文件（标准版）
        run: npm run build

      - name: Build 单文件（观景版）
        run: npm run build:viewer

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist-singlefile
          path: dist/*.html
          retention-days: 7
